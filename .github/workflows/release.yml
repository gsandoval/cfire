name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semantic version bump type (or custom)'
        required: true
        default: 'minor'
        type: choice
        options:
          - minor
          - major
          - patch
          - custom
      custom_version:
        description: 'Explicit X.Y.Z version when bump is custom (e.g. 0.12.0)'
        required: false
        type: string
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cfire-release
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       !startsWith(github.event.workflow_run.head_commit.message, 'chore(release):') &&
       github.event.workflow_run.actor.login != 'github-actions[bot]' &&
       github.actor != 'github-actions[bot]')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}
          fetch-depth: 0

      - name: Install Build & Runtime Dependencies
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libclang-rt-18-dev libzstd-dev libsimdjson-dev libsqlite3-dev libsodium-dev libssh-dev libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100

      - name: Bump Version & Push Tag (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          BUMP="${{ inputs.bump }}"
          if [ "$BUMP" = "custom" ]; then
            RAW_VER="${{ inputs.custom_version }}"
            TARGET="${RAW_VER#v}"
            if [ -z "$TARGET" ]; then
              echo "error: custom_version is required when bump is 'custom'" >&2
              exit 1
            fi
          else
            TARGET="$BUMP"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --tags
          git pull --rebase origin main
          ./scripts/release.sh "${TARGET}"
          NEW_VER="$(tr -d '[:space:]' < VERSION)"
          git push origin HEAD:main "v${NEW_VER}"

      - name: Auto-Patch or Tag Pre-Bumped Release on Green CI (workflow_run)
        if: github.event_name == 'workflow_run'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --tags
          git pull --rebase origin main
          FILE_VER="$(tr -d '[:space:]' < VERSION)"
          FILE_VER="${FILE_VER#v}"
          LATEST_TAG="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)"
          LATEST_VER="${LATEST_TAG#v}"
          semver_gt() {
            awk -v a="$1" -v b="$2" 'BEGIN {
              split(a, pa, "."); split(b, pb, ".");
              for (i = 1; i <= 3; i++) {
                if ((pa[i] + 0) > (pb[i] + 0)) exit 0;
                if ((pa[i] + 0) < (pb[i] + 0)) exit 1;
              }
              exit 1;
            }'
          }
          if [ -z "$LATEST_VER" ] || semver_gt "$FILE_VER" "$LATEST_VER"; then
            echo "Honoring pre-bumped VERSION=${FILE_VER} (latest tag: ${LATEST_TAG:-none})"
            make build
            ./cfire doc --check
            make review-check
            if ! git rev-parse "v${FILE_VER}" >/dev/null 2>&1; then
              git tag -a "v${FILE_VER}" -m "cfire v${FILE_VER}"
            fi
            git push origin "v${FILE_VER}"
          else
            echo "Auto-bumping patch release from ${FILE_VER} (latest tag: ${LATEST_TAG})"
            ./scripts/release.sh patch
            NEW_VER="$(tr -d '[:space:]' < VERSION)"
            git push origin HEAD:main "v${NEW_VER}"
          fi

      - name: Resolve Release Version & Verify Tag Matches VERSION
        id: meta
        run: |
          FILE_VER="$(tr -d '[:space:]' < VERSION)"
          FILE_VER="${FILE_VER#v}"
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VER" != "$FILE_VER" ]; then
              echo "error: release version (${TAG_VER}) does not match VERSION file (${FILE_VER})" >&2
              exit 1
            fi
          fi
          git rev-parse "v${FILE_VER}" >/dev/null 2>&1 || git fetch origin "refs/tags/v${FILE_VER}:refs/tags/v${FILE_VER}"
          SHORT_SHA="$(git rev-parse --short=7 "v${FILE_VER}^{commit}")"
          echo "version=${FILE_VER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${FILE_VER}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
            cc_pkg: clang-18
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            cc_pkg: clang-18
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Build Static musl Portable Bundle (${{ matrix.target }})
        env:
          TAG_VER: ${{ needs.prepare.outputs.version }}
          GIT_SHA: ${{ needs.prepare.outputs.sha }}
          TARGET_NAME: ${{ matrix.target }}
        run: |
          BUNDLE="cfire-v${TAG_VER}-${TARGET_NAME}"
          docker run --rm -v "$PWD:/work" -w /work alpine:3.20 sh -c "
            set -e
            apk add --no-cache clang lld llvm make git musl-dev libc++-dev libc++-static libstdc++-dev file binutils tar
            make -j\"\$(nproc)\" build CXX=clang++ GIT_SHA=\"${GIT_SHA}\" \
              EXTRA_CXXFLAGS=\"-stdlib=libc++\" \
              EXTRA_LDFLAGS=\"-static -stdlib=libc++ -fuse-ld=lld -lc++abi\"
            file ./cfire
            file ./cfire | grep -qE 'statically linked|static-pie'
            ! ldd ./cfire 2>&1 | grep -q '=> /'
            ./cfire --version | grep -F \"cfire ${TAG_VER} (${GIT_SHA},\"
            rm -rf \"./dist/${BUNDLE}\"
            ./cfire install --portable \"./dist/${BUNDLE}\"
          "

      - name: Verify Bundle Cleanliness & Package Archive (${{ matrix.target }})
        env:
          TAG_VER: ${{ needs.prepare.outputs.version }}
          TARGET_NAME: ${{ matrix.target }}
        run: |
          BUNDLE="cfire-v${TAG_VER}-${TARGET_NAME}"
          STRAY="$(find "./dist/${BUNDLE}" \( -name '*.pch' -o -name '*.a' -o -name '*.o' \))"
          test -z "$STRAY"
          test -f "./dist/${BUNDLE}/runtime/vendor/sqlite3/sqlite3.c"
          test -f "./dist/${BUNDLE}/runtime/vendor/simdjson/simdjson.cpp"
          test -f "./dist/${BUNDLE}/runtime/cfire-runtime.version"
          tar -czf "${BUNDLE}.tar.gz" -C ./dist "${BUNDLE}"

      - name: Clean-Room Unpacked Smoke Test (${{ matrix.target }})
        env:
          TAG_VER: ${{ needs.prepare.outputs.version }}
          TARGET_NAME: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cc_pkg }} lld
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100 || true
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100 || true
          BUNDLE="cfire-v${TAG_VER}-${TARGET_NAME}"
          SMOKE_DIR="$(mktemp -d)"
          tar -xzf "${BUNDLE}.tar.gz" -C "$SMOKE_DIR"
          cat > "$SMOKE_DIR/smoke.cf" << 'EOF'
          package main
          import "core:json"
          import "ext:db/sqlite"

          type Item struct {
              name: str `sql:"name" json:"name"`
          }

          fn main() {
              obj := try json.parse[Item]("{\"name\":\"cfire\"}")
              mut db := try sqlite.open(":memory:")
              defer db.close()
              try db.exec("CREATE TABLE t(name TEXT)")
              try db.exec("INSERT INTO t(name) VALUES ('ok')")
              rows := try db.query[Item]("SELECT name FROM t")
              println("{}:{}", obj.name, rows[0].name)
          }
          EOF
          HOME="$SMOKE_DIR/home" CFIRE_IGNORE_SYSTEM_LIBS=1 "$SMOKE_DIR/${BUNDLE}/cfire" build --portable "$SMOKE_DIR/smoke.cf" -o "$SMOKE_DIR/smoke_app"
          "$SMOKE_DIR/smoke_app" | grep -Fx "cfire:ok"

      - name: Upload Artifact (${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: cfire-v*-${{ matrix.target }}.tar.gz

  build-macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-latest
            arch: arm64
            extra_flags: "-mmacosx-version-min=13.3"
            smoke_native: "1"
          - target: macos-x86_64
            runner: macos-latest
            arch: x86_64
            extra_flags: "--target=x86_64-apple-macos13.3 -mmacosx-version-min=13.3"
            smoke_native: "0"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Build Portable Bundle (${{ matrix.target }})
        env:
          TAG_VER: ${{ needs.prepare.outputs.version }}
          GIT_SHA: ${{ needs.prepare.outputs.sha }}
          TARGET_NAME: ${{ matrix.target }}
          EXTRA_FLAGS: ${{ matrix.extra_flags }}
        run: |
          BUNDLE="cfire-v${TAG_VER}-${TARGET_NAME}"
          make -j"$(sysctl -n hw.ncpu)" build \
            GIT_SHA="${GIT_SHA}" \
            EXTRA_CXXFLAGS="${EXTRA_FLAGS}" \
            EXTRA_LDFLAGS="${EXTRA_FLAGS}"
          otool -L ./cfire
          otool -l ./cfire
          ! otool -L ./cfire | grep -E '/opt/homebrew|/usr/local'
          otool -L ./cfire | tail -n +2 | awk '{print $1}' | grep -vqE '^/usr/lib/(libc\+\+\.1|libSystem\.B)\.dylib$' && exit 1 || true
          otool -l ./cfire | grep -A3 'LC_BUILD_VERSION' | grep -q 'minos 13\.3'
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            ./cfire --version | grep -F "cfire ${TAG_VER} (${GIT_SHA},"
            ./cfire install --portable "./dist/${BUNDLE}"
          else
            # Build native helper binary briefly to run install --portable, then swap in x86_64 cfire binary
            mv -f ./cfire "${RUNNER_TEMP:-/tmp}/cfire.target_x86_64"
            make clean
            make -j"$(sysctl -n hw.ncpu)" build GIT_SHA="${GIT_SHA}"
            ./cfire install --portable "./dist/${BUNDLE}"
            mv -f "${RUNNER_TEMP:-/tmp}/cfire.target_x86_64" "./dist/${BUNDLE}/cfire"
            chmod 755 "./dist/${BUNDLE}/cfire"
          fi
          lipo -archs "./dist/${BUNDLE}/cfire" | grep -Fx "${{ matrix.arch }}"
          STRAY="$(find "./dist/${BUNDLE}" \( -name '*.pch' -o -name '*.a' -o -name '*.o' \))"
          test -z "$STRAY"
          test -f "./dist/${BUNDLE}/runtime/vendor/sqlite3/sqlite3.c"
          test -f "./dist/${BUNDLE}/runtime/vendor/simdjson/simdjson.cpp"
          test -f "./dist/${BUNDLE}/runtime/cfire-runtime.version"
          tar -czf "${BUNDLE}.tar.gz" -C ./dist "${BUNDLE}"

      - name: Run Native Quality Gate (macos-arm64)
        if: matrix.smoke_native == '1'
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install libsodium libssh zstd
          make review-check

      - name: Clean-Room Unpacked Smoke Test (macos-arm64)
        if: matrix.smoke_native == '1'
        env:
          TAG_VER: ${{ needs.prepare.outputs.version }}
          TARGET_NAME: ${{ matrix.target }}
        run: |
          BUNDLE="cfire-v${TAG_VER}-${TARGET_NAME}"
          SMOKE_DIR="$(mktemp -d)"
          tar -xzf "${BUNDLE}.tar.gz" -C "$SMOKE_DIR"
          cat > "$SMOKE_DIR/smoke.cf" << 'EOF'
          package main
          import "core:json"
          import "ext:db/sqlite"

          type Item struct {
              name: str `sql:"name" json:"name"`
          }

          fn main() {
              obj := try json.parse[Item]("{\"name\":\"cfire\"}")
              mut db := try sqlite.open(":memory:")
              defer db.close()
              try db.exec("CREATE TABLE t(name TEXT)")
              try db.exec("INSERT INTO t(name) VALUES ('ok')")
              rows := try db.query[Item]("SELECT name FROM t")
              println("{}:{}", obj.name, rows[0].name)
          }
          EOF
          HOME="$SMOKE_DIR/home" CFIRE_IGNORE_SYSTEM_LIBS=1 "$SMOKE_DIR/${BUNDLE}/cfire" build --portable "$SMOKE_DIR/smoke.cf" -o "$SMOKE_DIR/smoke_app"
          otool -L "$SMOKE_DIR/smoke_app"
          ! otool -L "$SMOKE_DIR/smoke_app" | grep -E '/opt/homebrew|/usr/local'
          otool -l "$SMOKE_DIR/smoke_app" | grep -A3 'LC_BUILD_VERSION' | grep -q 'minos 13\.3'
          "$SMOKE_DIR/smoke_app" | grep -Fx "cfire:ok"

      - name: Upload Artifact (${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: cfire-v*-${{ matrix.target }}.tar.gz

  build-windows:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            arch: x86_64
            can_execute: "1"
          - target: windows-arm64
            arch: arm64
            can_execute: "0"
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Setup MSYS2 (${{ matrix.target }})
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            make
            zip
            unzip
            tar
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-llvm
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-make
            mingw-w64-clang-aarch64-libc++
            mingw-w64-clang-aarch64-libunwind
            mingw-w64-clang-aarch64-compiler-rt
            mingw-w64-clang-aarch64-headers
            mingw-w64-clang-aarch64-crt
            mingw-w64-clang-aarch64-winpthreads

      - name: Build Static Portable Bundle (${{ matrix.target }})
        shell: msys2 {0}
        env:
          TAG_VER: ${{ needs.prepare.outputs.version }}
          GIT_SHA: ${{ needs.prepare.outputs.sha }}
          TARGET_NAME: ${{ matrix.target }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          BUNDLE="cfire-v${TAG_VER}-${TARGET_NAME}"
          rm -rf "./dist/${BUNDLE}"
          if [ "$TARGET_ARCH" = "x86_64" ]; then
            make -j4 build GIT_SHA="${GIT_SHA}"
            llvm-objdump -p ./cfire.exe
            ! llvm-objdump -p ./cfire.exe | grep -iE 'DLL Name:.*(libstdc\+\+|libc\+\+|libwinpthread|libgcc|libunwind)'
            ./cfire.exe --version | grep -F "cfire ${TAG_VER} (${GIT_SHA},"
            ./cfire.exe install --portable "./dist/${BUNDLE}"
          else
            CLANG_RES_WIN="$(clang++ -print-resource-dir)/lib/windows"
            mkdir -p "$CLANG_RES_WIN"
            cp -f /clangarm64/lib/clang/*/lib/windows/* "$CLANG_RES_WIN/"
            make -j4 build GIT_SHA="${GIT_SHA}" \
              EXTRA_CXXFLAGS="--target=aarch64-w64-mingw32 --sysroot=/clangarm64 -stdlib=libc++" \
              EXTRA_LDFLAGS="--target=aarch64-w64-mingw32 --sysroot=/clangarm64 -fuse-ld=lld -rtlib=compiler-rt -unwindlib=libunwind -stdlib=libc++"
            llvm-objdump -p ./cfire.exe
            ! llvm-objdump -p ./cfire.exe | grep -iE 'DLL Name:.*(libstdc\+\+|libc\+\+|libwinpthread|libgcc|libunwind)'
            llvm-objdump -f ./cfire.exe | grep -qiE 'aarch64|arm64'
            mv -f ./cfire.exe "${RUNNER_TEMP:-/tmp}/cfire.target_arm64.exe"
            make clean
            make -j4 build GIT_SHA="${GIT_SHA}"
            ./cfire.exe install --portable "./dist/${BUNDLE}"
            mv -f "${RUNNER_TEMP:-/tmp}/cfire.target_arm64.exe" "./dist/${BUNDLE}/cfire.exe"
          fi
          STRAY="$(find "./dist/${BUNDLE}" \( -name '*.pch' -o -name '*.a' -o -name '*.o' \))"
          test -z "$STRAY"
          test -f "./dist/${BUNDLE}/runtime/vendor/sqlite3/sqlite3.c"
          test -f "./dist/${BUNDLE}/runtime/vendor/simdjson/simdjson.cpp"
          test -f "./dist/${BUNDLE}/runtime/cfire-runtime.version"
          (cd ./dist && zip -r "../${BUNDLE}.zip" "${BUNDLE}")

      - name: Clean-Room Unpacked Smoke Test (windows-x86_64)
        if: matrix.can_execute == '1'
        shell: msys2 {0}
        env:
          TAG_VER: ${{ needs.prepare.outputs.version }}
          TARGET_NAME: ${{ matrix.target }}
        run: |
          BUNDLE="cfire-v${TAG_VER}-${TARGET_NAME}"
          SMOKE_DIR="$(mktemp -d)"
          unzip -q "${BUNDLE}.zip" -d "$SMOKE_DIR"
          cat > "$SMOKE_DIR/smoke.cf" << 'EOF'
          package main
          import "core:json"
          import "ext:db/sqlite"

          type Item struct {
              name: str `sql:"name" json:"name"`
          }

          fn main() {
              obj := try json.parse[Item]("{\"name\":\"cfire\"}")
              mut db := try sqlite.open(":memory:")
              defer db.close()
              try db.exec("CREATE TABLE t(name TEXT)")
              try db.exec("INSERT INTO t(name) VALUES ('ok')")
              rows := try db.query[Item]("SELECT name FROM t")
              println("{}:{}", obj.name, rows[0].name)
          }
          EOF
          USERPROFILE="$SMOKE_DIR/home" CFIRE_IGNORE_SYSTEM_LIBS=1 "$SMOKE_DIR/${BUNDLE}/cfire.exe" build --portable "$SMOKE_DIR/smoke.cf" -o "$SMOKE_DIR/smoke_app.exe"
          "$SMOKE_DIR/smoke_app.exe" | grep -Fx "cfire:ok"

      - name: Upload Artifact (${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: cfire-v*-${{ matrix.target }}.zip

  publish:
    needs: [prepare, build-linux, build-macos, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Download All Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd artifacts
          ls -la
          sha256sum cfire-v* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 6

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/cfire-v*
            artifacts/SHA256SUMS.txt

  deploy-pages:
    needs: [prepare, publish]
    runs-on: ubuntu-24.04
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Release Tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
