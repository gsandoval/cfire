name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Tag Matches VERSION & Build Toolchain
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          FILE_VER="$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG_VER" != "$FILE_VER" ]; then
            echo "error: git tag (${TAG_VER}) does not match VERSION file (${FILE_VER})" >&2
            exit 1
          fi
          make build
          ./cfire --version
          ./cfire --version | grep -F "cfire ${TAG_VER} ($(git rev-parse --short=7 HEAD),"

      - name: Run Review Check Quality Gates
        run: make review-check

      - name: Package Portable Release Bundle (macOS arm64)
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          ./cfire install --portable "./dist/cfire-v${TAG_VER}-macos-arm64"
          tar -czf "cfire-v${TAG_VER}-macos-arm64.tar.gz" -C ./dist "cfire-v${TAG_VER}-macos-arm64"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            cfire-v*-macos-arm64.tar.gz
