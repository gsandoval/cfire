name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build cfire Toolchain
        run: make build

      - name: Run Review Check Quality Gates
        run: make review-check

      - name: Run AddressSanitizer & UndefinedBehaviorSanitizer (all suites + conformance corpus)
        run: make test-asan

      - name: Run ThreadSanitizer (runtime concurrency + conformance concurrency programs)
        run: make test-tsan

  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libclang-rt-18-dev libzstd-dev libsimdjson-dev libsqlite3-dev libsodium-dev libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100

      - name: Build cfire Toolchain
        run: make build

      - name: Pollute /tmp to prove the LSP suites are hermetic (CF-178)
        run: |
          mkdir -p /tmp/.cfire /tmp/cfire_ci_pollution
          for i in $(seq 1 200); do
            printf 'package main\ntype AuditLog struct {\n    Junk: i32\n}\nfn bump(x: i32) -> i32 {\n    return x\n}\n' > /tmp/cfire_ci_pollution/junk_$i.cf
          done
          cp /tmp/cfire_ci_pollution/junk_1.cf /tmp/junk_root.cf

      - name: Run Review Check Quality Gates
        run: make review-check

      - name: Run AddressSanitizer & UndefinedBehaviorSanitizer (all suites + conformance corpus)
        run: make test-asan

      - name: Run ThreadSanitizer (runtime concurrency + conformance concurrency programs)
        run: make test-tsan

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install LLVM 18 with libFuzzer
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libclang-rt-18-dev libzstd-dev libsimdjson-dev libsqlite3-dev libsodium-dev
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100

      - name: Replay committed fuzz corpora under ASan/UBSan
        run: make fuzz-replay

      - name: libFuzzer smoke run (20s per target)
        run: make fuzz-lib FUZZ_SECONDS=20 FUZZ_CXX=clang++-18

      - name: Upload fuzz crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: .fuzz_crashes/

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 Clang64 Toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-make
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-simdjson
            mingw-w64-clang-x86_64-zstd
            mingw-w64-clang-x86_64-libsodium
            mingw-w64-clang-x86_64-sqlite3
            mingw-w64-clang-x86_64-python

      - name: Build cfire.exe on Windows
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          GIT_SHA="${GITHUB_SHA::7}"
          clang++ -std=c++2b -O2 -Wall -Wextra -Wno-parentheses-equality -DCFIRE_GIT_SHA=\"${GIT_SHA}\" -Iruntime -Isrc src/main.cpp -o cfire.exe -lws2_32 -ladvapi32 -lshell32

      - name: Verify cfire.exe Doctor, Formatting & Documentation Sync
        run: |
          ./cfire.exe --version
          ./cfire.exe doctor
          ./cfire.exe fmt --check examples/
          ./cfire.exe doc --check

      - name: Run Stdlib Conformance Suite on Windows
        run: ./cfire.exe test tests/stdlib_suite_test.cf

      - name: Build & Run C++ Unit Suites on Windows
        run: |
          clang++ -std=c++2b -O2 -Wall -Wextra -Wno-parentheses-equality -DCFIRE_GIT_SHA=\"dev\" -Iruntime -Isrc tests/unit/test_frontend.cpp tests/unit/test_sema.cpp tests/unit/test_stdlib.cpp tests/e2e/test_canonical.cpp tests/test_main.cpp -o cfire_test_runner.exe -lws2_32 -ladvapi32 -lshell32
          ./cfire_test_runner.exe unit

      - name: Run Language Conformance Corpus on Windows
        run: python3 -I scripts/run_conformance.py --cfire ./cfire.exe
