name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build cfire Toolchain
        run: make build

      - name: Run Review Check Quality Gates
        run: make review-check

      - name: Run AddressSanitizer & UndefinedBehaviorSanitizer
        run: make test-asan

  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libzstd-dev libsimdjson-dev libsqlite3-dev libsodium-dev libraylib-dev libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100

      - name: Build cfire Toolchain
        run: make build

      - name: Run Review Check Quality Gates
        run: make review-check

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 Clang64 Toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-make
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-simdjson
            mingw-w64-clang-x86_64-zstd
            mingw-w64-clang-x86_64-libsodium
            mingw-w64-clang-x86_64-sqlite3

      - name: Build cfire.exe on Windows
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          GIT_SHA="${GITHUB_SHA::7}"
          clang++ -std=c++2b -O2 -Wall -Wextra -Wno-parentheses-equality -DCFIRE_GIT_SHA=\"${GIT_SHA}\" -Iruntime -Isrc src/main.cpp -o cfire.exe -lws2_32 -ladvapi32 -lshell32

      - name: Verify cfire.exe Doctor, Formatting & Documentation Sync
        run: |
          ./cfire.exe --version
          ./cfire.exe doctor
          ./cfire.exe fmt --check examples/
          ./cfire.exe doc --check

      - name: Run Stdlib Conformance Suite on Windows
        run: ./cfire.exe test tests/stdlib_suite_test.cf
