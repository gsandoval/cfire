name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Documentation Synchronization
        run: |
          make build
          ./cfire doc --check

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for Pages Artifact Indexing
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: |
          for attempt in $(seq 1 30); do
            resp="$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages" || true)"
            if [ -n "${ARTIFACT_ID}" ]; then
              if printf '%s' "$resp" | grep -Eq "\"id\":[[:space:]]*${ARTIFACT_ID}([^0-9]|$)"; then
                echo "Pages artifact ${ARTIFACT_ID} is indexed (attempt ${attempt})."
                exit 0
              fi
            elif printf '%s' "$resp" | grep -Eq '"name":[[:space:]]*"github-pages"'; then
              echo "Pages artifact 'github-pages' is indexed (attempt ${attempt})."
              exit 0
            fi
            sleep 2
          done
          echo "::warning::Timed out waiting for github-pages artifact ${ARTIFACT_ID} to appear in REST API; proceeding with deploy-pages anyway"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
